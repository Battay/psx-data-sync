[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psx-data-sync"
version = "0.5.0"
description = "Reliable Pakistan Stock Exchange historical data synchronization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "pandas",
    "pyarrow",
    "pydantic",
    "PySide6>=6.5.0",
    "rich",
    "tenacity",
    "typer",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]
build = [
    "pyinstaller>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
search-path = [".", "src"]
